# =============================================================================
# TMPMAS pre-commit configuration
# =============================================================================
# This file tells the `pre-commit` framework which checks to run before each
# commit. To activate locally after cloning:
#
#     pip install pre-commit
#     pre-commit install
#
# To run all hooks manually against every file:
#
#     pre-commit run --all-files
#
# To update all hook versions to their latest releases:
#
#     pre-commit autoupdate
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # File hygiene — basic sanity checks on all text files
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Remove trailing whitespace; some editors leave it behind.
      - id: end-of-file-fixer
        # Ensure every file ends with a single newline (POSIX standard).
      - id: check-yaml
        # Validate YAML syntax before it reaches CI.
      - id: check-json
        # Validate JSON syntax.
      - id: check-merge-conflict
        # Block commits containing unresolved merge markers (<<<<<<<).
      - id: check-added-large-files
        args: ['--maxkb=500']
        # Reject accidental commits of large binaries (>500 KB).
      - id: mixed-line-ending
        args: ['--fix=lf']
        # Normalise line endings to LF. Prevents CRLF vs LF noise.

   # ---------------------------------------------------------------------------
  # Secret detection — gitleaks, run inside a Linux container
  # ---------------------------------------------------------------------------
  # Windows 11 Smart App Control blocks the gitleaks binary when run
  # directly on the host (WinError 4551). Running it inside a Linux container
  # sidesteps Windows SAC entirely and uses the same tool version as CI.
  #
  # Why `detect`, not `protect --staged`: gitleaks' `--staged` mode relies on
  # git access inside the container to read the index. On Docker Desktop for
  # Windows, that access doesn't work reliably — gitleaks silently falls back
  # to scanning commits and misses staged content. `detect --source` scans
  # files directly and works reliably across platforms.
  #
  # Fail-open behaviour: if Docker is not running, the hook prints a warning
  # and allows the commit. Push protection and CI provide the authoritative
  # checks in that case.
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect secrets (gitleaks, containerised)
        entry: >
          bash -c '
          if ! docker info >/dev/null 2>&1; then
            echo "WARNING: Docker not running; skipping gitleaks. Push will be checked by CI." >&2;
            exit 0;
          fi;
          HOST_DIR="$(pwd -W 2>/dev/null || pwd)";
          MSYS_NO_PATHCONV=1 docker run --rm --pull=never
          -v "${HOST_DIR}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source=/repo --no-git
          --config=/repo/.gitleaks.toml
          --verbose --no-banner --redact
          '
        language: system
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Python linting and formatting — ruff (replaces flake8, isort, black)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: ['--fix']
        # Lint Python files; auto-fix what can be auto-fixed.
      - id: ruff-format
        # Format Python files (equivalent to black).

   # ---------------------------------------------------------------------------
  # Python type checking — mypy
  # ---------------------------------------------------------------------------
  # Note: mypy is not used in pre-commit because its compiled C extensions are
  # blocked by Windows 11 Smart App Control ([WinError 4551]). Type checking
  # runs in the CI pipeline on GitHub-hosted Linux runners (see
  # .github/workflows/ci.yml → type-check job).


# =============================================================================
# Exclusions
# =============================================================================
# The following files are never checked by hooks. Add patterns here for
# generated files, vendored code, or files where checks are counterproductive.
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      build/|
      dist/|
      node_modules/|
      .*\.min\.js|
      .*\.min\.css
  )$
