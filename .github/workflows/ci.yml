name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC — catches dependency and tool drift over time.
    - cron: '0 2 * * *'

# Principle of least privilege: workflows only need read access unless they
# explicitly require more. Individual jobs can override this if needed.
permissions:
  contents: read

# Cancel in-progress runs for the same ref. Prevents queue pile-up when a
# developer pushes rapidly to a branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.7.1

      - name: Run ruff lint
        run: ruff check src tests

  # ---------------------------------------------------------------------------
  # Format check — ruff format
  # ---------------------------------------------------------------------------
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.7.1

      - name: Check formatting
        run: ruff format --check src tests

  # ---------------------------------------------------------------------------
  # Type check — mypy
  # ---------------------------------------------------------------------------
  type-check:
    name: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mypy
        run: pip install mypy==1.13.0

      - name: Run mypy
        run: mypy src

  # ---------------------------------------------------------------------------
  # CodeQL — static security analysis
  # ---------------------------------------------------------------------------
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ---------------------------------------------------------------------------
  # Security — gitleaks + pip-audit
  # ---------------------------------------------------------------------------
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan every commit, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Free for public repos; the action detects and reports findings.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit dependencies
        run: pip-audit --strict --desc || echo "::warning::pip-audit found issues — review before merge"

  # ---------------------------------------------------------------------------
  # Tests — pytest with coverage
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install pytest==8.3.3 pytest-cov==6.0.0

      - name: Run tests with coverage
        # Coverage measurement enabled; threshold temporarily disabled until
        # Phase 5 Sprint 1 adds real application code. Re-enable with
        # --cov-fail-under=80 once src/ contains testable modules.
        run: pytest --cov=src --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Traceability — Conventional Commits + story reference
  # ---------------------------------------------------------------------------
  # Warn-only until the RTM lands (see ADR-024). When the RTM is complete,
  # remove `continue-on-error: true` to make this gate blocking.
  traceability:
    name: traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits format
        run: |
          set +e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "Not a PR context; skipping commit-format check."
            exit 0
          fi
          COMMITS=$(git log --format='%s' "$BASE..$HEAD")
          BAD=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf)(\([^)]+\))?: .+'; then
              echo "::warning::Commit does not follow Conventional Commits: $msg"
              BAD=$((BAD+1))
            fi
          done <<< "$COMMITS"
          if [ "$BAD" -gt 0 ]; then
            echo "::warning::$BAD commit(s) do not follow Conventional Commits format."
          else
            echo "All commits follow Conventional Commits."
          fi

      - name: Validate story reference in PR body
        run: |
          set +e
          BODY="${{ github.event.pull_request.body }}"
          if [ -z "$BODY" ]; then
            echo "::warning::PR body is empty; cannot verify story reference."
            exit 0
          fi
          if echo "$BODY" | grep -qE '(Refs|Closes|Fixes): #[0-9]+|US-[0-9]+|F-[0-9]+'; then
            echo "PR body references a tracked item."
          else
            echo "::warning::PR body does not reference a story, feature, or issue."
          fi
