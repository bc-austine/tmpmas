# =============================================================================
# TMPMAS — Docker Compose Development Environment
# =============================================================================
# Minimal Phase 5 Sprint 0 environment: application container + PostgreSQL.
#
# From repo root:
#     docker compose -f ops/compose/docker-compose.yml up -d
#
# Or, more conveniently:
#     make up
#
# The Makefile wraps these commands.
# =============================================================================

name: tmpmas

services:
  app:
    container_name: tmpmas-app
    build:
      context: ../..
      dockerfile: ops/docker/app.Dockerfile
    image: tmpmas/app:dev
    working_dir: /app
    volumes:
      # Bind-mount the repo so host edits appear instantly in the container.
      - ../..:/app
      # Anonymous volumes for directories that should NOT be shared with the
      # host — the container generates its own caches that would be noise on
      # the host.
      - /app/.venv
      - /app/.pytest_cache
      - /app/.mypy_cache
      - /app/.ruff_cache
    environment:
      TMPMAS_ENV: ${TMPMAS_ENV:-development}
      TMPMAS_LOG_LEVEL: ${TMPMAS_LOG_LEVEL:-DEBUG}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tmpmas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmpmas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tmpmas}
    depends_on:
      db:
        condition: service_healthy
    # Keep the container alive when no command is running so `make shell` works.
    command: sleep infinity
    dns:
       - 172.25.0.53
    networks:
      - tmpmas-net


  db:
    container_name: tmpmas-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmpmas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmpmas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tmpmas}
    ports:
      # Expose only on localhost so other machines on the network can't reach it.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tmpmas} -d ${POSTGRES_DB:-tmpmas}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - tmpmas-net

  # ---------------------------------------------------------------------------
  # DNS blocklist server (ADR-019)
  # ---------------------------------------------------------------------------
  # The app container uses this as its only DNS resolver. Domains in
  # ops/network/betting-domains.yaml resolve to 0.0.0.0 (null route).
  # Other containers use Docker's default DNS; only the app is restricted.
  blocklist-dns:
    container_name: tmpmas-blocklist-dns
    build:
      context: ../dns
      dockerfile: Dockerfile
    image: tmpmas/dns:dev
    restart: unless-stopped
    volumes:
      - ../network/betting-domains.yaml:/etc/tmpmas/betting-domains.yaml:ro
    networks:
      tmpmas-net:
        ipv4_address: 172.25.0.53

  prometheus:
    container_name: tmpmas-prometheus
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - tmpmas-net
    depends_on:
      - otel-collector

  grafana:
    container_name: tmpmas-grafana
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - tmpmas-net
    depends_on:
      - prometheus

  otel-collector:
    container_name: tmpmas-otel-collector
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    volumes:
      - ../otel/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    networks:
      - tmpmas-net

volumes:
  postgres-data:
    name: tmpmas-postgres-data
  prometheus-data:
    name: tmpmas-prometheus-data
  grafana-data:
    name: tmpmas-grafana-data

networks:
  tmpmas-net:
    name: tmpmas-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
